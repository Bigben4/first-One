<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Login</title>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="brand">
            <h1>Brand</h1>
            <p class="tag">Red & White — account access</p>
        </div>

        <div class="forms">
                    <form id="loginForm" class="form active" aria-hidden="false">
                <h2>Log in</h2>
                <div class="input">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" name="email" required>
                </div>
                        <div class="input password">
                            <label for="loginPassword">Password</label>
                            <input id="loginPassword" type="password" name="password" required minlength="6">
                            <button type="button" class="eye-btn" data-target="loginPassword" aria-label="Show password">
                                <!-- simple eye icon -->
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                <button type="submit" class="btn red">Log in</button>
                <p class="switch">Don't have an account? <a href="#" data-switch="signup">Sign up</a></p>
            </form>

                    <form id="signupForm" class="form" aria-hidden="true">
                <h2>Create account</h2>
                <div class="input">
                    <label for="signupName">Full name</label>
                    <input id="signupName" type="text" name="name" required>
                </div>
                <div class="input">
                    <label for="signupEmail">Email</label>
                    <input id="signupEmail" type="email" name="email" required>
                </div>
                        <div class="input password">
                            <label for="signupPassword">Password</label>
                            <input id="signupPassword" type="password" name="password" required minlength="6">
                            <button type="button" class="eye-btn" data-target="signupPassword" aria-label="Show password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                        <button type="submit" class="btn white">Sign up</button>
                <p class="switch">Already have an account? <a href="#" data-switch="login">Log in</a></p>
            </form>
        </div>

        <div id="message" class="message" aria-live="polite"></div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>

    <script src="main.js"></script>
</body>
</html>
